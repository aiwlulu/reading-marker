<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <style>
      * { box-sizing: border-box; }
      body {
        width: 300px; margin: 0; padding: 14px;
        font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
        font-size: 13.5px; color: #323a52; background: #fff;
      }
      h1 { margin: 0 0 2px; font-size: 15px; }
      .sub { margin: 0 0 10px; color: #8a91a3; font-size: 12px; }
      .quick { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
      .row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 0; border-top: 1px solid #ecedf4;
      }
      .row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      input[type="checkbox"] { width: 16px; height: 16px; accent-color: #5b5fe9; cursor: pointer; }
      .colors { border-top: 1px solid #ecedf4; padding: 8px 0; display: flex; flex-direction: column; gap: 6px; }
      .colors h2 { margin: 0 0 2px; font-size: 12px; color: #8a91a3; font-weight: 700; letter-spacing: .06em; }
      .color-row { display: flex; align-items: center; gap: 8px; }
      .color-row input[type="color"] { width: 30px; height: 24px; padding: 0 2px; border: 1px solid #dee0ec; border-radius: 6px; background: none; cursor: pointer; }
      .color-row input[type="text"] {
        flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid #dee0ec; border-radius: 8px;
        font: inherit; font-size: 13px; color: inherit; background: #f8f9fc;
      }
      .actions { display: flex; flex-direction: column; gap: 8px; }
      button.primary {
        width: 100%; padding: 10px 12px; border: 0; border-radius: 12px;
        background: #5b5fe9; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
      button.primary:disabled { opacity: .5; cursor: default; }
      .status { color: #8a91a3; font-size: 12px; min-height: 16px; }
      details { border-top: 1px solid #ecedf4; padding-top: 8px; }
      summary { cursor: pointer; color: #8a91a3; font-size: 12px; font-weight: 700; list-style-position: inside; }
      details[open] summary { margin-bottom: 6px; }
      .loading { animation: rm-pulse 1.1s ease-in-out infinite; }
      @keyframes rm-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1e27; color: #c7cbd9; }
        .row, .colors, details { border-top-color: #2b2e39; }
        .color-row input[type="text"] { background: #23262f; border-color: #3a3e4c; }
        .color-row input[type="color"] { border-color: #3a3e4c; }
      }
    </style>
  </head>
  <body>
    <h1>Reading Marker</h1>
    <p class="sub" id="page-status">準備匯出本頁筆記</p>

    <div class="quick">
      <div class="actions">
        <button class="primary" id="export-md" disabled type="button">匯出本頁筆記（Markdown）</button>
        <div class="status" id="action-status" role="status"></div>
      </div>
    </div>

    <details>
      <summary>設定</summary>

      <div class="row">
        <label><input type="checkbox" id="notes-enabled" checked>螢光筆與筆記</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="toc-enabled" checked>目錄（TOC）</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="site-enabled" checked>在此網站啟用</label>
      </div>

      <!-- Static rows: the popup is fully laid out straight from HTML; JS only
           reconciles values, so first paint never waits on storage. -->
      <div class="colors">
        <h2>顏色與說明</h2>
        <div id="color-rows">
          <div class="color-row" data-index="0"><input type="color" value="#fde047"><input type="text" value="重點" maxlength="12" placeholder="說明"></div>
          <div class="color-row" data-index="1"><input type="color" value="#fca5a5"><input type="text" value="待確認" maxlength="12" placeholder="說明"></div>
          <div class="color-row" data-index="2"><input type="color" value="#93c5fd"><input type="text" value="想補充" maxlength="12" placeholder="說明"></div>
          <div class="color-row" data-index="3"><input type="color" value="#86efac"><input type="text" value="已確認" maxlength="12" placeholder="說明"></div>
        </div>
      </div>

      <div class="row">
        <label><input type="checkbox" id="export-labels">匯出時附顏色說明</label>
      </div>
    </details>

    <script src="util.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
